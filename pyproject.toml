[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="acit4040-api"
version="0.1.0"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","httpx>=0.27,<1"]

[project.optional-dependencies]
dev=["pytest>=8,<9","ruff>=0.6,<1","mypy>=1.11,<2"]

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["apps/api/tests","tests"]

[tool.ruff]
line-length=100
